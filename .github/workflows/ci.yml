name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: [ "ubuntu-latest" ]
    container:
      image: ghcr.io/rspamd/rspamd-build-docker:rbldnsd-build
      options: --user root
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          mkdir build.rbldnsd
          cd build.rbldnsd
          cmake -DNO_IPv6=ON $GITHUB_WORKSPACE
          make
          cd $GITHUB_WORKSPACE
          mv build.rbldnsd/rbldnsd* .
          bash -c "source /venv/bin/activate && robot test/functional/cases"
          bash -c "source /venv/bin/activate && python3 test/pyunit/tests.py"

  feature-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libev-dev zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build.features -DCMAKE_BUILD_TYPE=Debug
          cmake --build build.features --parallel 2
      - name: Run feature suites as an unprivileged user
        run: python3 test/run_feature_tests.py build.features/rbldnsd
